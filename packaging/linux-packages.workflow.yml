name: linux-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (no v prefix)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.1.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Lubuntu/Ubuntu x86_64 package
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build g++ libssl-dev python3 make tar gzip
          scripts/setup.sh
          VERSION="$VERSION" scripts/package.sh

      - name: Build Fedora x86_64 package
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:40 bash -lc '
            dnf install -y git cmake ninja-build gcc-c++ openssl-devel python3 make tar gzip
            git config --global --add safe.directory /work
            VERSION='"$VERSION"' scripts/setup.sh
            VERSION='"$VERSION"' scripts/package.sh
          '

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
